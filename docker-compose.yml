# One command brings up the database and the service:
#   docker compose up --build        (add -d --wait to background and block until healthy)
# Verify:  curl http://localhost:3480/health/db   (or: sh scripts/smoke.sh)
#
# Services
#   db       Postgres 17 (dev/demo data, persistent volume, host port 15432)
#   api      Fastify service; runs migrations on start, then serves on host port 3480
#   db-test  Throwaway Postgres for the integration test harness (profile `test`, port 55432,
#            tmpfs + fsync off: fast and disposable; never holds data you care about)
#   tests    Every test layer in a container (profile `tests`; uses db-test), so only Docker is needed:
#              docker compose --profile test run --rm --build tests
#            Integration runs against db-test, e2e against api, over the compose network.

name: planet-express

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=500
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      DATABASE_URL: postgres://app:app@db:5432/app
      MIGRATE_ON_START: "true"
      # API test mode (x-test-session -> isolated DB per session). On for this dev/demo stack;
      # set TEST_SESSIONS_ENABLED=false for any deployment holding real data.
      TEST_SESSIONS_ENABLED: ${TEST_SESSIONS_ENABLED:-true}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-250}
      LOG_SQL: ${LOG_SQL:-false}
    ports:
      - "${API_PORT:-3480}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/db >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  db-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=300
    ports:
      - "${TEST_DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  tests:
    # Own profile: `--profile test up` (db-test for host runs) must never start a suite run.
    profiles: ["tests"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      TEST_DATABASE_ADMIN_URL: postgres://app:app@db-test:5432/postgres
      E2E_BASE_URL: http://api:3000
    depends_on:
      db-test:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  db-data:
